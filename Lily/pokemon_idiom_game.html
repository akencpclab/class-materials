<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>成語寶可夢闖關王 - 台灣懷舊經典版</title>
  <style>
    :root {
      --bg1: #fefcf5;
      --bg2: #f0f8ff;
      --card-p: rgba(255, 255, 255, 0.96);
      --card-d: #e74c3c;
      --text: #2c3e50;
      --muted: #7f8c8d;
      --primary: #ff6b81;
      --primary2: #3498db;
      --good: #2ecc71;
      --bad: #e74c3c;
      --border-p: #ecf0f1;
      --border-d: #c0392b;
      --shadow-p: 0 10px 25px rgba(189, 195, 199, 0.3);
      --shadow-d: 0 12px 24px rgba(192, 57, 43, 0.2);
      --radius-p: 20px;
      --radius-d: 20px;
      --font-size: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "SF Pro TC", "Noto Sans TC", "MicroSoft JhengHei", sans-serif;
      color: var(--text);
      font-size: var(--font-size);
      background:
        radial-gradient(circle at 5% 5%, #fff1c9 0, transparent 25%),
        radial-gradient(circle at 95% 5%, #e1f5fe 0, transparent 25%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      min-height: 100vh;
      line-height: 1.6;
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 15px;
    }
    .game-grid {
      display: grid;
      grid-template-columns: 1fr 310px;
      gap: 20px;
      align-items: start;
    }
    .panel-paper {
      background: var(--card-p);
      border: 1px solid var(--border-p);
      border-radius: var(--radius-p);
      box-shadow: var(--shadow-p);
      padding: 22px;
      position: relative;
    }
    h1 {
      margin: 0 0 5px;
      font-size: 1.8rem;
      color: #2c3e50;
      letter-spacing: -0.5px;
    }
    .sub {
      color: var(--muted);
      margin-bottom: 15px;
      font-size: 0.92rem;
      line-height: 1.5;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
    button:active { transform: translateY(1px) scale(0.97); }
    .btn-primary { background: linear-gradient(135deg, var(--primary), #ff9f80); color: white; }
    .btn-blue { background: linear-gradient(135deg, var(--primary2), #5dade2); color: white; }
    .btn-ghost { background: white; border: 1px solid var(--border-p); color: var(--text); }
    .btn-sm { padding: 8px 14px; font-size: 0.85rem; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 15px;
    }
    .stat {
      background: #fdfefe;
      border: 1px solid #eef2f5;
      border-radius: 12px;
      padding: 10px 5px;
      text-align: center;
    }
    .stat-label { font-size: 0.8rem; color: var(--muted); }
    .stat-value { display: block; font-size: 1.25rem; font-weight: 800; color: #34495e; margin-top: 2px; }
    .panel-rotom {
      background: var(--card-d);
      border: 3px solid var(--border-d);
      border-radius: var(--radius-d);
      box-shadow: var(--shadow-d);
      padding: 12px;
      color: white;
      position: relative;
    }
    .rotom-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .rotom-leds { display: flex; gap: 6px; }
    .led { width: 10px; height: 10px; border-radius: 50%; background: #96231a; border: 1px solid #66100a; }
    .led.active-green { background: #2ecc71; box-shadow: 0 0 8px #2ecc71; border-color: #fff; animation: blink 0.5s ease 2; }
    .led.active-red { background: #e74c3c; box-shadow: 0 0 8px #e74c3c; border-color: #fff; animation: blink 0.5s ease 2; }
    .rotom-id { font-family: monospace; font-weight: bold; background: #96231a; padding: 1px 6px; border-radius: 4px; font-size: 0.75rem; }
    .pokemon-screen {
      width: 100%;
      background: linear-gradient(180deg, #1d2b3a, #0a1017);
      border: 3px solid #2c3e50;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .pokemon-screen::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 2px);
      pointer-events: none;
    }
    .scan-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background: rgba(52, 152, 219, 0.6);
      box-shadow: 0 0 8px #3498db;
      top: -10px;
      opacity: 0;
    }
    .panel-rotom.busy .scan-line { animation: scan 1.0s ease-in-out infinite; opacity: 1; }
    .pokemon-screen-chip {
      background: rgba(255,255,255,0.08);
      color: #5dade2;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: bold;
      display: inline-flex;
    }
    .pokemon-screen img {
      width: 85%;
      max-width: 170px;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      margin: 8px auto;
      display: block;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.25));
      transition: opacity 0.2s ease;
    }
    .panel-rotom.busy .pokemon-screen img { opacity: 0.2; }
    .rotom-info {
      width: 100%;
      background: rgba(255,255,255,0.1);
      padding: 8px;
      border-radius: 8px;
      margin-top: 8px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: center;
    }
    .type-badges { display: flex; gap: 4px; }
    .type-badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; color: white; }
    .type-null { background: #7f8c8d; }
    .type-grass { background: #2ecc71; }
    .type-electric { background: #f1c40f; color: #2c3e50; }
    .type-poison { background: #9b59b6; }
    .type-dark { background: #34495e; }
    .type-dragon { background: #9b59b6; }
    .type-fire { background: #e67e22; }
    .pokemon-name-display { font-size: 0.95rem; font-weight: bold; color: white; text-align: right; }
    .file-rule { font-size: 0.75rem; color: #f5b7b1; margin-top: 5px; text-align: center; }
    .question-card { padding: 25px; }
    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-p);
    }
    .q-id { color: var(--primary2); font-weight: bold; font-size: 1.15rem; }
    .q-hint { color: var(--muted); font-size: 0.85rem; }
    .prompt {
      font-size: 1.3rem;
      line-height: 1.65;
      font-weight: 700;
      color: #2c3e50;
      margin: 0 0 20px;
    }
    .blank {
      color: var(--primary);
      font-weight: 800;
      border-bottom: 3px solid var(--primary);
      padding: 0 6px;
      margin: 0 2px;
    }
    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .option {
      border: 2px solid #ebf0f4;
      border-radius: 16px;
      padding: 22px 18px;
      text-align: left;
      background: #fdfefe;
      min-height: 80px;
      font-weight: bold;
      line-height: 1.4;
      font-size: 1.15rem;
      color: #34495e;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.01);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .option:hover:not(:disabled) { border-color: var(--primary2); background: #f4f9fd; transform: translateY(-2px); }
    .option:disabled { cursor: not-allowed; }
    .option.correct { background: #eafaf1; border-color: #2ecc71; color: #27ae60; box-shadow: 0 0 10px rgba(46, 204, 113, 0.1) inset; }
    .option.wrong { background: #fdf2f2; border-color: #e74c3c; color: #c0392b; }
    .feedback {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #555;
      background: #f5f9fc;
      padding: 12px 15px;
      border-radius: 10px;
      min-height: 45px;
    }
    .note-box {
      white-space: pre-wrap;
      line-height: 1.6;
      color: #444;
      max-height: 250px;
      overflow-y: auto;
      background: rgba(255,255,255,0.6);
      border: 1px dashed #cbd5e0;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
      font-size: 0.85rem;
    }
    .note-header { font-weight: bold; color: #2c3e50; font-size: 0.95rem; }
    .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 30px; background: #34495e; color: white; border-radius: 999px; padding: 10px 22px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); display: none; z-index: 200; text-align: center; font-weight: bold; font-size: 0.95rem; }
    .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.4); z-index: 300; padding: 20px; }
    .modal .panel-paper { width: min(550px, 100%); text-align: center; padding: 30px 20px; }
    .big-emoji { font-size: 3rem; margin-bottom: 8px; }
    @keyframes blink { to { background-color: #66100a; box-shadow: none; border-color: #66100a; } }
    @keyframes scan { 0% { top: -10px; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
    @media (max-width: 950px) {
      .game-grid { grid-template-columns: 1fr; }
      .panel-rotom { order: -1; }
    }
    @media (max-width: 600px) {
      .options { grid-template-columns: 1fr; }
      .option { padding: 18px 14px; min-height: 70px; font-size: 1.05rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="game-grid">
      <div style="display:flex; flex-direction:column; gap:20px;">
        <div class="panel-paper question-card">
          <div class="q-meta">
            <div class="q-id" id="qidLabel">第 1 題</div>
            <div class="q-hint">點選最適合這段台灣懷舊情境的成語</div>
          </div>
          <div class="prompt" id="prompt">正在載入經典成語問題...</div>
          <div class="options" id="options"></div>
          <div class="feedback" id="feedback"></div>
        </div>
        <div class="panel-paper">
          <div class="note-header">📝 本次挑戰答題筆記</div>
          <div class="note-box" id="notes">尚未開始挑戰。答錯與答對的題目會顯示在這裡。</div>
        </div>
      </div>
      <div style="display:flex; flex-direction:column; gap:20px;">
        <div class="panel-rotom" id="rotomPanel">
          <div class="rotom-top">
            <div class="rotom-leds">
              <div class="led" id="ledGreen"></div>
              <div class="led" id="ledRed"></div>
            </div>
            <div class="rotom-id">ROTOM-LITE</div>
          </div>
          <div class="pokemon-screen">
            <div class="scan-line"></div>
            <div class="pokemon-screen-chip">SCANNING SYSTEM</div>
            <img id="pokemonImage" src="" alt="寶可夢圖鑑" />
          </div>
          <div class="rotom-info">
            <div class="type-badges" id="typeBadges">
              <span class="type-badge type-null">無屬性</span>
            </div>
            <div class="pokemon-name-display" id="pokemonName">準備完畢</div>
          </div>
          <div class="file-rule">掃描完畢，寶可夢圖鑑已更新</div>
        </div>
        <div class="panel-paper">
          <h1>寶可夢成語王</h1>
          <div class="sub">每次重新開始皆會自動打亂經典題目與答題選項。</div>
          <div class="toolbar">
            <button class="btn-primary" onclick="restartGame()">⚡ 重新挑戰</button>
            <button class="btn-sm btn-ghost" onclick="toggleMusic()" id="musicBtn">🎵 背景音樂：關</button>
          </div>
          <div class="stats">
            <div class="stat"><div class="stat-label">進度</div><b class="stat-value" id="progress">1/20</b></div>
            <div class="stat"><div class="stat-label">答對</div><b class="stat-value" id="score" style="color:var(--good);">0</b></div>
            <div class="stat"><div class="stat-label">答錯</div><b class="stat-value" id="wrong" style="color:var(--bad);">0</b></div>
            <div class="stat"><div class="stat-label">字級</div><b class="stat-value" id="fontSizeLabel" style="font-size:1rem;margin-top:6px;">18px</b></div>
          </div>
          <div class="toolbar" style="margin-top:12px; justify-content:center;">
            <button class="btn-sm btn-blue" onclick="changeFontSize(-1)">A -</button>
            <button class="btn-sm btn-blue" onclick="changeFontSize(1)">A +</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="modal" id="finishModal">
    <div class="panel-paper">
      <div class="big-emoji">🏆</div>
      <h2 style="font-size:1.8rem;margin:5px 0 10px;">順利破關！</h2>
      <div id="finishText" class="sub" style="margin-bottom:20px; font-size:1rem;">太棒了，你完成了所有成語挑戰！</div>
      <div class="toolbar" style="justify-content:center;">
        <button class="btn-good btn-primary" onclick="restartGame()">重新開始</button>
        <button class="btn-ghost" onclick="closeFinish()">看答案筆記</button>
      </div>
    </div>
  </div>

  { idiom: "口誅筆伐", pronunciation: "ㄎㄡˇ ㄓㄨ ㄅㄧˇ ㄈㄚˊ", explanation: "大家一起用說話或文字來批評壞事。", sentence: "對於工廠亂排黑水害死溪裡吳郭魚的惡劣行為，村民們決定團結起來進行{BLANK}。" },
  { idiom: "勢均力敵", pronunciation: "ㄕˋ ㄐㄩㄣ ㄌㄧˋ ㄉㄧˊ", explanation: "雙方實力差不多，分不出上下。", sentence: "今天的扯鈴比賽中，紅隊與藍隊實力{BLANK}，最後分數竟然一模一樣。" },
  { idiom: "光怪陸離", pronunciation: "ㄍㄨㄤ ㄍㄨㄞˋ ㄌㄨˋ ㄌㄧˊ", explanation: "奇奇怪怪、五花八門的景象。", sentence: "萬聖節同樂會上，教室裡滿是吸血鬼、殭屍和南瓜怪，真是一幅{BLANK}的逗趣畫面。" },
  { idiom: "初出茅廬", pronunciation: "ㄔㄨ ㄔㄨ ㄇㄠˊ ㄌㄨˊ", explanation: "剛開始做一件事，還沒有太多經驗。", sentence: "剛從師範學校畢業的林老師，雖然是一位{BLANK}的新手，但對全班充滿了熱忱。" },
  { idiom: "投機取巧", pronunciation: "ㄊㄡˊ ㄐㄧ ㄑㄩˇ ㄑㄧㄠˇ", explanation: "不肯老實努力，只想靠歪腦筋或偷懶過關。", sentence: "寫作業應該要腳踏實地一步一步寫，絕對不能{BLANK}、直接抄寫解答。" },
  { idiom: "禮尚往來", pronunciation: "ㄌㄧˇ ㄕㄤˋ ㄨㄤˇ ㄌㄞˊ", explanation: "你對我有禮貌、對我好，我也要同樣回禮。", sentence: "端午節時鄰居阿姨送我們一串肉粽，媽媽也回送一包自製綠豆椪，這就是鄰里間的{BLANK}。" },
  { idiom: "耳濡目染", pronunciation: "ㄦˇ ㄖㄨˊ ㄇㄨˋ ㄖㄢˇ", explanation: "天天看到、聽到，慢慢自然就學會了。", sentence: "阿明家裡世代在廟口演布袋戲，他在長期{BLANK}下，才國小三年級就會靈巧地操作木偶了。" }
];

const wrongChoices = ["一成不變","不知所措","大聲嚷嚷","慢條斯理","東奔西跑","自以為是","心花怒放","七嘴八舌","半途而廢","井然有序","同心協力","輕而易舉","膽小如鼠","草木皆兵","目不轉睛","坐以待斃","無精打采","水落石出","順手牽羊","畫蛇添足","如虎添翼","一箭雙鵰","按部就班","三心二意"];

const pokeballSvg = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%23ffffff" stroke="%232c3e50" stroke-width="6"/><path d="M5 50 A45 45 0 0 1 95 50 Z" fill="%23e74c3c" stroke="%232c3e50" stroke-width="6"/><line x1="5" y1="50" x2="95" y2="50" stroke="%232c3e50" stroke-width="6"/><circle cx="50" cy="50" r="18" fill="%23ffffff" stroke="%232c3e50" stroke-width="6"/><circle cx="50" cy="50" r="8" fill="%232c3e50"/></svg>';

let game = { questions: [], index: 0, score: 0, wrong: 0, answered: false, notesCorrect: [], notesWrong: [], fontSize: 18, musicOn: false, musicTimer: null, audioCtx: null };

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuestions() {
  const order = shuffle([...idiomsData]);
  return order.map(item => {
    const pool = wrongChoices.filter(x => x !== item.idiom);
    const shuffledWrong = shuffle(pool);
    const choices = shuffle([item.idiom, ...shuffledWrong.slice(0, 3)]);
    return { ...item, choices };
  });
}

function setFontSize(delta) {
  game.fontSize = Math.max(14, Math.min(26, game.fontSize + delta));
  document.documentElement.style.setProperty('--font-size', game.fontSize + 'px');
  document.getElementById('fontSizeLabel').textContent = game.fontSize + 'px';
}
function changeFontSize(delta) { setFontSize(delta); }

function updateStats() {
  document.getElementById('progress').textContent = `${Math.min(game.index + 1, game.questions.length)} / ${game.questions.length}`;
  document.getElementById('score').textContent = game.score;
  document.getElementById('wrong').textContent = game.wrong;
}

function showToast(text) {
  const toast = document.getElementById('toast');
  toast.textContent = text;
  toast.style.display = 'block';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.style.display = 'none', 1800);
}

const rotomPanel = document.getElementById('rotomPanel');
const ledGreen = document.getElementById('ledGreen');
const ledRed = document.getElementById('ledRed');
const pokemonImgElement = document.getElementById('pokemonImage');
const typeBadgesElement = document.getElementById('typeBadges');
const pokemonNameElement = document.getElementById('pokemonName');

function setRotomUi(type) {
  rotomPanel.classList.add('busy');
  let data = rotomData[type];
  let src = '';
  let name = '';
  if (type === 'correct') {
    const idx = Math.floor(Math.random() * pokemonAssets.correct.length);
    src = pokemonAssets.correct[idx];
    name = pokemonNames.correct[idx];
  } else if (type === 'wrong') {
    src = pokemonAssets.wrong;
    name = pokemonNames.wrong;
  } else if (type === 'clear') {
    src = pokemonAssets.clear;
    name = pokemonNames.clear;
  } else {
    src = pokeballSvg;
    name = '寶可夢圖鑑';
    data = rotomData.idle;
  }
  if (type === 'correct') { ledGreen.classList.add('active-green'); setTimeout(()=>ledGreen.classList.remove('active-green'), 1000); }
  if (type === 'wrong') { ledRed.classList.add('active-red'); setTimeout(()=>ledRed.classList.remove('active-red'), 1000); }
  setTimeout(() => {
    pokemonImgElement.src = src;
    typeBadgesElement.innerHTML = data.badge;
    pokemonNameElement.textContent = name;
    rotomPanel.classList.remove('busy');
  }, 400);
}

function buildNotes() {
  const parts = [];
  parts.push('<b>【答對題目】</b>');
  if (game.notesCorrect.length) {
    game.notesCorrect.forEach((x, i) => {
      parts.push(`${i + 1}. <span style="color:var(--good); font-weight:bold;">${x.idiom}</span>（${x.pronunciation}）<br>　💡意義：${x.explanation}`);
    });
  } else { parts.push('尚未有答對紀錄。'); }
  parts.push('\n<b>【答錯題目】</b>');
  if (game.notesWrong.length) {
    game.notesWrong.forEach((x, i) => {
      parts.push(`${i + 1}. <span style="color:var(--bad); font-weight:bold;">${x.idiom}</span> ｜ 正確答案是：${x.correctAnswer}<br>　💡意義：${x.explanation}`);
    });
  } else { parts.push('尚未有答錯紀錄，非常棒！'); }
  document.getElementById('notes').innerHTML = parts.join('\n');
}

function renderQuestion() {
  game.answered = false;
  updateStats();
  const q = game.questions[game.index];
  document.getElementById('qidLabel').textContent = `第 ${game.index + 1} 題`;
  document.getElementById('prompt').innerHTML = q.sentence.replace('{BLANK}', '<span class="blank">______</span>');
  document.getElementById('feedback').innerHTML = '<span style="color:var(--muted);">請在下方選擇一個成語答案作答。</span>';
  const optionsContainer = document.getElementById('options');
  optionsContainer.innerHTML = '';
  q.choices.forEach(choice => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = choice;
    btn.onclick = () => answer(choice, btn);
    optionsContainer.appendChild(btn);
  });
}

function answer(choice, btn) {
  if (game.answered) return;
  game.answered = true;
  const q = game.questions[game.index];
  const buttons = [...document.querySelectorAll('.option')];
  buttons.forEach(b => b.disabled = true);
  const feedbackElement = document.getElementById('feedback');
  if (choice === q.idiom) {
    game.score++;
    playCorrectSound();
    btn.classList.add('correct');
    setRotomUi('correct');
    feedbackElement.innerHTML = `<b style="color:var(--good); font-size:1.1rem;">🎉 答對了！</b> <b>${q.idiom}</b> (${q.pronunciation})：${q.explanation}`;
    showToast('🏆 答對了！真厲害！');
    game.notesCorrect.push(q);
  } else {
    game.wrong++;
    playWrongSound();
    btn.classList.add('wrong');
    setRotomUi('wrong');
    const correctBtn = buttons.find(b => b.textContent === q.idiom);
    if (correctBtn) correctBtn.classList.add('correct');
    feedbackElement.innerHTML = `<b style="color:var(--bad); font-size:1.1rem;">😢 再想一想唷！</b> 正確答案應該是：<b>${q.idiom}</b>（${q.pronunciation}）：${q.explanation}`;
    showToast('❌ 答錯了，下次一定行！');
    game.notesWrong.push({ ...q, correctAnswer: q.idiom });
  }
  buildNotes();
  updateStats();
  setTimeout(() => {
    if (game.index < game.questions.length - 1) { game.index++; renderQuestion(); }
    else { finishGame(); }
  }, 2500);
}

function finishGame() {
  setRotomUi('clear');
  playClearSound();
  document.getElementById('finishText').innerHTML = `恭喜完成了全部 20 題成語大考驗！<br>答對了 <b style="color:var(--good);font-size:1.4rem;">${game.score}</b> 題，答錯了 <b style="color:var(--bad);">${game.wrong}</b> 題。`;
  document.getElementById('finishModal').style.display = 'flex';
}
function closeFinish() { document.getElementById('finishModal').style.display = 'none'; }

function restartGame() {
  closeFinish();
  game.questions = buildQuestions();
  game.index = 0; game.score = 0; game.wrong = 0;
  game.notesCorrect = []; game.notesWrong = [];
  setRotomUi('idle');
  buildNotes(); updateStats(); renderQuestion();
}

function ensureAudio() { if (!game.audioCtx) { const AudioContext = window.AudioContext || window.webkitAudioContext; game.audioCtx = new AudioContext(); } if (game.audioCtx.state === 'suspended') { game.audioCtx.resume(); } }
function playTone(freq, duration, type = 'sine', gainValue = 0.05) { ensureAudio(); const ctx = game.audioCtx; const o = ctx.createOscillator(); const g = ctx.createGain(); o.type = type; o.frequency.value = freq; g.gain.value = gainValue; o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + duration / 1000); }
function playCorrectSound() { playTone(523.25, 110, 'triangle', 0.04); setTimeout(() => playTone(659.25, 120, 'triangle', 0.04), 110); setTimeout(() => playTone(783.99, 180, 'triangle', 0.05), 240); }
function playWrongSound() { playTone(220, 180, 'sawtooth', 0.03); setTimeout(() => playTone(174.61, 220, 'sawtooth', 0.03), 140); }
function playClearSound() { const seq = [523.25, 659.25, 783.99, 1046.5, 1318.5]; seq.forEach((f, i) => setTimeout(() => playTone(f, 150, 'triangle', 0.05), i * 140)); setTimeout(() => playTone(1567.98, 250, 'sine', 0.04), 780); }
function toggleMusic() {
  game.musicOn = !game.musicOn;
  document.getElementById('musicBtn').textContent = `🎵 背景音樂：${game.musicOn ? '開' : '關'}`;
  game.musicOn ? startMusic() : stopMusic();
  showToast(`音樂已${game.musicOn ? '開啟' : '關閉'}`);
}
function startMusic() { if (game.musicTimer) return; ensureAudio(); const melody = [523.25, 659.25, 783.99, 659.25, 587.33, 523.25, 440, 523.25]; let i = 0; game.musicTimer = setInterval(() => { if (!game.musicOn) return; playTone(melody[i % melody.length], 120, 'sine', 0.012); i++; }, 280); }
function stopMusic() { clearInterval(game.musicTimer); game.musicTimer = null; }

setFontSize(0);
setRotomUi('idle');
restartGame();
</script>
