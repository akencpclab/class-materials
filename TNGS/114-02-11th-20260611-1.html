<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>高二化學練習｜勒沙特列原理與化學平衡</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@400;600;700&display=swap');

  :root {
    --bg: #0f1923;
    --surface: #1a2736;
    --surface2: #223044;
    --accent: #00d4ff;
    --accent2: #7c3aed;
    --correct: #22c55e;
    --wrong: #ef4444;
    --text: #e8f4f8;
    --text-muted: #8badc0;
    --border: #2d4a63;
    --font-size: 16px;
    --card-radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: var(--font-size);
    min-height: 100vh;
    transition: background 0.4s;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── TOP BAR ── */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(15,25,35,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .topbar-title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 0.9em;
    color: var(--accent);
    letter-spacing: 0.02em;
    flex: 1;
    white-space: nowrap;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 5px 10px;
  }

  .ctrl-label {
    font-size: 0.72em;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .ctrl-btn {
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 7px;
    background: var(--surface2);
    color: var(--text);
    font-size: 1em;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, transform 0.1s;
    touch-action: manipulation;
  }
  .ctrl-btn:active { transform: scale(0.9); }

  .font-display {
    font-size: 0.8em;
    color: var(--accent);
    font-weight: 700;
    min-width: 32px;
    text-align: center;
  }

  /* Color swatches */
  .color-swatches {
    display: flex;
    gap: 5px;
    align-items: center;
  }
  .swatch {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
    touch-action: manipulation;
  }
  .swatch:active { transform: scale(1.2); }
  .swatch.active { border-color: var(--accent); transform: scale(1.15); }

  /* Score badge */
  .score-badge {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.8em;
    font-weight: 700;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    color: var(--text);
    white-space: nowrap;
  }
  .score-badge span { color: var(--accent); }

  /* ── MAIN ── */
  .main {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px 80px;
  }

  /* ── PROGRESS BAR ── */
  .progress-wrap {
    margin-bottom: 18px;
  }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.78em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .progress-track {
    height: 5px;
    background: var(--surface2);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }

  /* ── QUESTION CARD ── */
  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    padding: 24px 22px 20px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .question-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
  }

  .q-tag {
    display: inline-block;
    font-size: 0.68em;
    font-weight: 700;
    color: var(--accent2);
    background: rgba(124,58,237,0.15);
    border: 1px solid rgba(124,58,237,0.3);
    border-radius: 6px;
    padding: 2px 8px;
    margin-bottom: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .q-text {
    font-size: 1.05em;
    line-height: 1.7;
    color: var(--text);
    font-weight: 500;
  }

  /* ── OPTIONS ── */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }

  .option-btn {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    text-align: left;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    transition: border-color 0.2s, background 0.2s, transform 0.1s;
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.95em;
    line-height: 1.6;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .option-btn:active:not(:disabled) { transform: scale(0.98); }
  .option-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--surface2);
  }

  .opt-letter {
    width: 28px;
    height: 28px;
    min-width: 28px;
    border-radius: 8px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.85em;
    font-family: 'Space Grotesk', sans-serif;
    color: var(--text-muted);
    transition: background 0.2s, border-color 0.2s, color 0.2s;
    margin-top: 1px;
  }

  .opt-text { flex: 1; }

  .option-btn.correct {
    border-color: var(--correct);
    background: rgba(34,197,94,0.12);
    animation: pulse-correct 0.4s ease;
  }
  .option-btn.correct .opt-letter {
    background: var(--correct);
    border-color: var(--correct);
    color: #fff;
  }

  .option-btn.wrong {
    border-color: var(--wrong);
    background: rgba(239,68,68,0.1);
    animation: shake 0.4s ease;
  }
  .option-btn.wrong .opt-letter {
    background: var(--wrong);
    border-color: var(--wrong);
    color: #fff;
  }

  .option-btn.reveal {
    border-color: var(--correct);
    background: rgba(34,197,94,0.07);
  }
  .option-btn.reveal .opt-letter {
    background: var(--correct);
    border-color: var(--correct);
    color: #fff;
  }

  .option-btn:disabled { cursor: default; }

  @keyframes pulse-correct {
    0% { transform: scale(1); }
    40% { transform: scale(1.025); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%,60% { transform: translateX(-5px); }
    40%,80% { transform: translateX(5px); }
  }

  /* ── FEEDBACK ── */
  .feedback {
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 16px;
    font-size: 0.9em;
    line-height: 1.7;
    display: none;
  }
  .feedback.show { display: block; animation: fadeIn 0.3s ease; }
  .feedback.correct-fb {
    background: rgba(34,197,94,0.12);
    border: 1px solid rgba(34,197,94,0.3);
    color: #86efac;
  }
  .feedback.wrong-fb {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    color: #fca5a5;
  }
  .fb-emoji { font-size: 1.2em; margin-right: 6px; }
  .fb-title { font-weight: 700; margin-bottom: 4px; }
  .fb-explain { color: var(--text); opacity: 0.85; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── NEXT BUTTON ── */
  .next-btn {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: #fff;
    font-size: 1em;
    font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
    cursor: pointer;
    display: none;
    transition: opacity 0.2s, transform 0.1s;
    letter-spacing: 0.03em;
    touch-action: manipulation;
  }
  .next-btn.show { display: block; animation: fadeIn 0.3s ease; }
  .next-btn:active { transform: scale(0.98); opacity: 0.9; }

  /* ── RESULT SCREEN ── */
  .result-screen {
    display: none;
    text-align: center;
    padding: 30px 20px;
    animation: fadeIn 0.5s ease;
  }
  .result-screen.show { display: block; }

  .result-emoji { font-size: 4em; margin-bottom: 16px; display: block; }
  .result-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.6em;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .result-sub { color: var(--text-muted); margin-bottom: 24px; font-size: 0.95em; }

  .result-score-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    padding: 24px;
    margin-bottom: 24px;
  }
  .result-big-num {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 3.5em;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .result-big-denom { font-size: 0.5em; color: var(--text-muted); }
  .result-stats {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 16px;
  }
  .stat { text-align: center; }
  .stat-num { font-size: 1.4em; font-weight: 700; }
  .stat-label { font-size: 0.75em; color: var(--text-muted); }
  .stat.c .stat-num { color: var(--correct); }
  .stat.w .stat-num { color: var(--wrong); }

  .restart-btn {
    width: 100%;
    max-width: 320px;
    padding: 15px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: #fff;
    font-size: 1em;
    font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
    cursor: pointer;
    letter-spacing: 0.03em;
    touch-action: manipulation;
    transition: transform 0.1s;
  }
  .restart-btn:active { transform: scale(0.97); }

  /* ── START SCREEN ── */
  .start-screen {
    text-align: center;
    padding: 24px 16px;
    animation: fadeIn 0.5s ease;
  }
  .start-screen.hidden { display: none; }

  .start-logo {
    font-size: 3em;
    margin-bottom: 12px;
  }
  .start-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.5em;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 6px;
    background: linear-gradient(135deg, #7c3aed, #00d4ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .start-sub {
    color: var(--text-muted);
    font-size: 0.9em;
    margin-bottom: 28px;
    line-height: 1.6;
  }
  .start-info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 28px;
    text-align: left;
  }
  .info-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
  }
  .info-icon { font-size: 1.4em; margin-bottom: 6px; }
  .info-label { font-size: 0.75em; color: var(--text-muted); margin-bottom: 2px; }
  .info-val { font-size: 0.9em; font-weight: 700; }

  .start-btn {
    width: 100%;
    max-width: 320px;
    padding: 16px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: #fff;
    font-size: 1.05em;
    font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
    cursor: pointer;
    letter-spacing: 0.04em;
    touch-action: manipulation;
    transition: transform 0.1s, opacity 0.2s;
    box-shadow: 0 6px 24px rgba(0,212,255,0.25);
  }
  .start-btn:active { transform: scale(0.97); }

  /* ── QUIZ AREA ── */
  .quiz-area { animation: fadeIn 0.3s ease; }
  .quiz-area.hidden { display: none; }

  /* ── STREAK TOAST ── */
  .streak-toast {
    position: fixed;
    top: 70px;
    right: 16px;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    color: #fff;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 0.85em;
    font-weight: 700;
    z-index: 200;
    pointer-events: none;
    opacity: 0;
    transform: translateY(-8px);
    transition: opacity 0.25s, transform 0.25s;
  }
  .streak-toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-title">⚗️ 化學平衡練習</div>
  <div class="controls">
    <!-- Font size -->
    <div class="ctrl-group">
      <span class="ctrl-label">字級</span>
      <button class="ctrl-btn" onclick="changeFont(-1)" aria-label="縮小字體">−</button>
      <span class="font-display" id="fontDisplay">16</span>
      <button class="ctrl-btn" onclick="changeFont(1)" aria-label="放大字體">＋</button>
    </div>
    <!-- BG Colors -->
    <div class="ctrl-group">
      <span class="ctrl-label">背景</span>
      <div class="color-swatches" id="swatches"></div>
    </div>
    <!-- Score -->
    <div class="score-badge" id="scoreBadge" style="display:none">
      ✓ <span id="scoreNum">0</span> / <span id="scoreDen">0</span>
    </div>
  </div>
</div>

<!-- STREAK TOAST -->
<div class="streak-toast" id="streakToast"></div>

<!-- MAIN -->
<div class="main">

  <!-- START SCREEN -->
  <div class="start-screen" id="startScreen">
    <div class="start-logo">🧪</div>
    <div class="start-title">高二化學<br>勒沙特列原理</div>
    <div class="start-sub">根據你的重點字卡設計<br>每次啟動題目與選項都會隨機排列</div>
    <div class="start-info">
      <div class="info-card">
        <div class="info-icon">📝</div>
        <div class="info-label">題目數量</div>
        <div class="info-val" id="qCountDisplay">—</div>
      </div>
      <div class="info-card">
        <div class="info-icon">🔀</div>
        <div class="info-label">出題方式</div>
        <div class="info-val">隨機排列</div>
      </div>
      <div class="info-card">
        <div class="info-icon">🎵</div>
        <div class="info-label">互動音效</div>
        <div class="info-val">答題反饋</div>
      </div>
      <div class="info-card">
        <div class="info-icon">📱</div>
        <div class="info-label">適用裝置</div>
        <div class="info-val">手機 / 平板</div>
      </div>
    </div>
    <button class="start-btn" onclick="startQuiz()">開始練習 🚀</button>
  </div>

  <!-- QUIZ AREA -->
  <div class="quiz-area hidden" id="quizArea">
    <div class="progress-wrap">
      <div class="progress-info">
        <span id="qProgress">第 1 題 / 共 — 題</span>
        <span id="qPercent">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>

    <div class="question-card">
      <div class="q-tag">單選題</div>
      <div class="q-text" id="questionText">題目載入中…</div>
    </div>

    <div class="options" id="optionsList"></div>

    <div class="feedback" id="feedback">
      <div class="fb-emoji" id="fbEmoji"></div>
      <div class="fb-title" id="fbTitle"></div>
      <div class="fb-explain" id="fbExplain"></div>
    </div>

    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">下一題 →</button>
  </div>

  <!-- RESULT SCREEN -->
  <div class="result-screen" id="resultScreen">
    <span class="result-emoji" id="resultEmoji">🎉</span>
    <div class="result-title" id="resultTitle">練習完成！</div>
    <div class="result-sub" id="resultSub">來看看你的成績吧</div>
    <div class="result-score-card">
      <div class="result-big-num" id="resultBigNum">0<span class="result-big-denom" id="resultBigDen">/0</span></div>
      <div style="color:var(--text-muted);font-size:0.8em;margin-top:6px;">答對題數</div>
      <div class="result-stats">
        <div class="stat c"><div class="stat-num" id="rCorrect">0</div><div class="stat-label">✅ 答對</div></div>
        <div class="stat w"><div class="stat-num" id="rWrong">0</div><div class="stat-label">❌ 答錯</div></div>
        <div class="stat"><div class="stat-num" id="rPct" style="color:var(--accent)">0%</div><div class="stat-label">🎯 正確率</div></div>
      </div>
    </div>
    <button class="restart-btn" onclick="restartQuiz()">🔄 再練習一次</button>
  </div>

</div><!-- /main -->

<script>
/* ═══════════════════════════════════════════════════
   QUESTION BANK  —  從字卡轉換的選擇題
═══════════════════════════════════════════════════ */
const QUESTIONS = [
  {
    q: "根據勒沙特列原理，在平衡系統中「移動（shift）」的方向，主要取決於什麼？",
    opts: ["各物質的濃度大小", "莫耳數的變化（Δn）", "反應物與產物的質量比", "溶液的溫度高低"],
    ans: 1,
    explain: "勒沙特列原理的核心：移動方向直接與莫耳數的變化有對接關係，而非直接看濃度。濃度會騙人（如體積改變），必須先看莫耳數變化。"
  },
  {
    q: "鉻酸根（CrO₄²⁻）在水溶液中呈現什麼顏色？",
    opts: ["橘色", "血紅色", "黃色", "無色"],
    ans: 2,
    explain: "黃色鉻酸根（CrO₄²⁻）在水溶液中呈黃色；而橘色的是二鉻酸根（Cr₂O₇²⁻）。這是高頻考題，顏色一定要記清楚！"
  },
  {
    q: "二鉻酸根（Cr₂O₇²⁻）在水溶液中呈現什麼顏色？",
    opts: ["黃色", "無色", "藍色", "橘色"],
    ans: 3,
    explain: "Cr₂O₇²⁻（二鉻酸根）在水溶液中呈橘色。記憶口訣：「二鉻橘色，鉻酸黃色」。"
  },
  {
    q: "對含有 CrO₄²⁻ 與 Cr₂O₇²⁻ 的平衡系統加入 H⁺（酸），平衡會往哪個方向移動？",
    opts: ["往產生黃色鉻酸根的方向移動", "往產生橘色二鉻酸根的方向移動", "平衡不移動", "往氣體增多的方向移動"],
    ans: 1,
    explain: "加入 H⁺ 破壞平衡，系統為消耗 H⁺，會往產生「橘色二鉻酸根（Cr₂O₇²⁻）」的方向移動，溶液顏色由黃轉橘。"
  },
  {
    q: "對鉻酸根平衡系統加入 NaOH（鹼），平衡移動的結果是？",
    opts: ["往產生橘色二鉻酸根的方向", "平衡不受鹼的影響", "往產生黃色鉻酸根的方向", "系統被完全破壞無法恢復"],
    ans: 2,
    explain: "OH⁻ 會吃掉 H⁺，系統為彌補 H⁺ 的減少，會往產生「黃色鉻酸根（CrO₄²⁻）」的方向移動，溶液顏色由橘轉黃。"

const SWATCH_COLORS = ["#0f1923","#100e1a","#0d1a12","#f5f0e8","#1a1a2e"];
let currentTheme = 0;

function buildSwatches() {
  const wrap = document.getElementById('swatches');
  THEMES.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'swatch' + (i === 0 ? ' active' : '');
    el.style.background = t.bg;
    if (t.bg === '#f5f0e8') el.style.border = '2px solid #d4c9b0';
    el.title = t.label;
    el.onclick = () => setTheme(i);
    wrap.appendChild(el);
  });
}

function setTheme(idx) {
  currentTheme = idx;
  const t = THEMES[idx];
  const r = document.documentElement.style;
  r.setProperty('--bg', t.bg);
  r.setProperty('--surface', t.surface);
  r.setProperty('--surface2', t.surface2);
  r.setProperty('--border', t.border);
  r.setProperty('--text', t.text);
  r.setProperty('--text-muted', t.muted);
  document.querySelectorAll('.swatch').forEach((s, i) => s.classList.toggle('active', i === idx));
}

let fontSize = 16;
function changeFont(delta) {
  fontSize = Math.min(22, Math.max(12, fontSize + delta));
  document.documentElement.style.setProperty('--font-size', fontSize + 'px');
  document.getElementById('fontDisplay').textContent = fontSize;
}

/* ═══════════════════════════════════════════════════
   SOUND ENGINE (Web Audio API)
═══════════════════════════════════════════════════ */
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(config) {
  try {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume();
    config.forEach(({ freq, type = 'sine', start = 0, dur = 0.15, vol = 0.3 }) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
      gain.gain.setValueAtTime(0, ctx.currentTime + start);
      gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + dur + 0.05);
    });
  } catch(e) {}
}

  ]);
}

  const melody = [523,587,659,698,784,880];
  melody.forEach((f, i) => {
    playTone([{ freq: f, type: 'triangle', start: i * 0.1, dur: 0.18, vol: 0.22 }]);
  });
}

function soundClick() {
  playTone([{ freq: 880, type: 'sine', start: 0, dur: 0.06, vol: 0.12 }]);
}

/* ═══════════════════════════════════════════════════
   QUIZ ENGINE
═══════════════════════════════════════════════════ */
let shuffledQuestions = [];
let currentIdx = 0;
let correctCount = 0;
let wrongCount = 0;
let answered = false;
let streak = 0;
let streakTimer = null;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  soundClick();
  shuffledQuestions = shuffle(QUESTIONS).map(q => {
    const indices = q.opts.map((_, i) => i);
    const shuffledIdx = shuffle(indices);
    const newOpts = shuffledIdx.map(i => q.opts[i]);
    const newAns = shuffledIdx.indexOf(q.ans);
    return { ...q, opts: newOpts, ans: newAns };
  });
  currentIdx = 0;
  correctCount = 0;
  wrongCount = 0;
  streak = 0;

  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('show');
  document.getElementById('quizArea').classList.remove('hidden');

  const badge = document.getElementById('scoreBadge');
  badge.style.display = '';
  updateScoreBadge();
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = shuffledQuestions[currentIdx];
  const total = shuffledQuestions.length;
  const pct = Math.round((currentIdx / total) * 100);

  // Progress
  document.getElementById('qProgress').textContent = `第 ${currentIdx + 1} 題 / 共 ${total} 題`;
  document.getElementById('qPercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';

  // Question
  document.getElementById('questionText').textContent = q.q;

  // Options
  const letters = ['A', 'B', 'C', 'D'];
  const list = document.getElementById('optionsList');
  list.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span class="opt-text">${opt}</span>`;
    btn.onclick = () => selectOption(i);
    list.appendChild(btn);
  });

  // Hide feedback & next
  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  const nb = document.getElementById('nextBtn');
  nb.className = 'next-btn';
}

function selectOption(selectedIdx) {
  if (answered) return;
  answered = true;
  soundClick();

  const q = shuffledQuestions[currentIdx];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);

  const fb = document.getElementById('feedback');

  if (selectedIdx === q.ans) {
    // CORRECT
    correctCount++;
    streak++;
    btns[selectedIdx].classList.add('correct');
    soundCorrect();
    fb.className = 'feedback correct-fb show';
    document.getElementById('fbEmoji').textContent = getCorrectEmoji();
    document.getElementById('fbTitle').textContent = getCorrectTitle();
    document.getElementById('fbExplain').textContent = q.explain;
    if (streak >= 3) showStreakToast();
  } else {
    // WRONG
    wrongCount++;
    streak = 0;
    btns[selectedIdx].classList.add('wrong');
    btns[q.ans].classList.add('reveal');
    soundWrong();
    fb.className = 'feedback wrong-fb show';
    document.getElementById('fbEmoji').textContent = '💡';
    document.getElementById('fbTitle').textContent = '答錯了！來看看正確解析';
    document.getElementById('fbExplain').textContent = q.explain;
  }

  updateScoreBadge();

  const nb = document.getElementById('nextBtn');
  const isLast = currentIdx === shuffledQuestions.length - 1;
  nb.textContent = isLast ? '查看成績 🎯' : '下一題 →';
  nb.className = 'next-btn show';
}

function getCorrectEmoji() {
  const emojis = ['🎉','⚡','🔥','🌟','🎯','✨','💪','🚀','🧪','⚗️'];
  return emojis[Math.floor(Math.random() * emojis.length)];
}
function getCorrectTitle() {
  const titles = ['答對了！你太強了！','完全正確！繼續保持！','太棒了！理解得很透徹！','讚！化學高手在此！','完美！勒沙特列都在看著你！'];
  return titles[Math.floor(Math.random() * titles.length)];
}

function showStreakToast() {
  const toast = document.getElementById('streakToast');
  toast.textContent = `🔥 連答 ${streak} 題正確！`;
  toast.classList.add('show');
  clearTimeout(streakTimer);
  streakTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

function updateScoreBadge() {
  document.getElementById('scoreNum').textContent = correctCount;
  document.getElementById('scoreDen').textContent = currentIdx + (answered ? 1 : 0);
}

function nextQuestion() {
  soundClick();
  currentIdx++;
  if (currentIdx >= shuffledQuestions.length) {
    showResult();
  } else {
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function showResult() {
  document.getElementById('quizArea').classList.add('hidden');
  const total = shuffledQuestions.length;
  const pct = Math.round((correctCount / total) * 100);

  let emoji = '😊', title = '還不錯喔！', sub = '再多練習幾次就能更上層樓！';
  if (pct >= 90) { emoji = '🏆'; title = '化學大師！'; sub = '幾乎全對，勒沙特列是你的摯友！'; }
  else if (pct >= 75) { emoji = '🌟'; title = '表現優秀！'; sub = '熟練度很高，再鞏固一下細節！'; }
  else if (pct >= 60) { emoji = '📚'; title = '繼續加油！'; sub = '掌握了大部分概念，繼續練習！'; }
  else { emoji = '🧪'; title = '需要複習一下！'; sub = '建議重新看一遍字卡，再來練習！'; }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultSub').textContent = sub;
  document.getElementById('resultBigNum').innerHTML = `${correctCount}<span class="result-big-denom">/${total}</span>`;
  document.getElementById('rCorrect').textContent = correctCount;
  document.getElementById('rWrong').textContent = wrongCount;
  document.getElementById('rPct').textContent = pct + '%';

  const rs = document.getElementById('resultScreen');
  rs.classList.add('show');
  document.getElementById('scoreBadge').style.display = 'none';
  soundFinish();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restartQuiz() {
  soundClick();
  document.getElementById('resultScreen').classList.remove('show');
  startQuiz();
}

/* ═══════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  buildSwatches();
  document.getElementById('qCountDisplay').textContent = QUESTIONS.length + ' 題';
});
</script>
